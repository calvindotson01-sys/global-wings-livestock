name: Deploy Global Wings & Livestock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          rm -rf public
          mkdir -p public
          cp index.html animals.html reviews-contact.html admin.html styles.css script.js reviews.js admin.js robots.txt sitemap.xml public/
          cp -r assets public/assets
          echo "----- WORKER.JS CONTENT -----"
          nl -ba worker.js
          node --check worker.js
      - name: Deploy to Cloudflare
        run: npx wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
